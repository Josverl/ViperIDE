[project]
name = "viperide-tests"
version = "0.0.0"
description = "Python test environment for the ViperIDE browser tests"
requires-python = ">=3.10"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
